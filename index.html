function buildGrid(spec){
  const g=[];for(let r=0;r<ROWS;r++)g.push(new Array(COLS).fill('.'));
  let low=0;
  for(const k in spec.rows){const r=+k,s=spec.rows[k];for(let c=0;c<COLS;c++)if(s[c]==='#')g[r][c]='-';if(r>low)low=r;}
  for(const [c,t,b] of spec.lad){for(let r=t;r<b;r++)g[r][c]='H';}
  for(let r=low+1;r<ROWS;r++)for(let c=0;c<COLS;c++)g[r][c]='=';
  return g;
}

/* ---------- police pixel 5x7 ---------- */
const GLYPH={};for(const k in FONT_SRC)GLYPH[k]=FONT_SRC[k].split(' ');
function text(s,x,y,col,sc,opt){
  sc=sc||1;opt=opt||{};
  s=String(s).toUpperCase().replace(/[’‘´`]/g,"'").replace(/[–—]/g,'-').replace(/Œ/g,'OE').replace(/…/g,'...');
  const w=s.length*6*sc-sc;
  if(x==='c')x=Math.round((W-w)/2);
  for(let pass=opt.shadow?0:1;pass<2;pass++){
    for(let i=0;i<s.length;i++){
      let ch=s[i],acc=null;
      if(ACC[ch]){acc=ACC[ch][1];ch=ACC[ch][0];}
      const g=GLYPH[ch];if(!g)continue;
      const px=x+i*6*sc+(pass===0?sc:0),py=y+(pass===0?sc:0);
      const colr=r=>pass===0?'#000':(typeof col==='function'?col(r,i):col);
      for(let r=0;r<7;r++){const row=g[r];for(let c=0;c<5;c++)if(row[c]==='1'){C.fillStyle=colr(r);C.fillRect(px+c*sc,py+r*sc,sc,sc);}}
      if(acc){C.fillStyle=colr(0);const ay=py-sc;
        if(acc==='a')C.fillRect(px+3*sc,ay,sc,sc);
        else if(acc==='g')C.fillRect(px+1*sc,ay,sc,sc);
        else if(acc==='c')C.fillRect(px+2*sc,ay,sc,sc);
        else if(acc==='d'){C.fillRect(px+1*sc,ay,sc,sc);C.fillRect(px+3*sc,ay,sc,sc);}
        else if(acc==='z')C.fillRect(px+2*sc,py+7*sc,sc,sc);}
    }
  }
  return w;
}

/* ---------- audio (puces façon SID) ---------- */
let actx=null,master=null,muted=false,noiseBuf=null;
function audioInit(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=0.55;master.connect(actx.destination);}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function tone(f,dur,type,vol,slideTo,delay){
  if(!actx||muted)return;const t=actx.currentTime+(delay||0);
  const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,vol){
  if(!actx||muted)return;
  if(!noiseBuf){const n=Math.floor(actx.sampleRate*0.25);noiseBuf=actx.createBuffer(1,n,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
  const s=actx.createBufferSource(),g=actx.createGain(),t=actx.currentTime;s.buffer=noiseBuf;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}

}

function thick(g,x0,y0,x1,y1,w,col){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx-dy,x=x0,y=y0;
  g.fillStyle=col;
  for(let n=0;n<200;n++){g.fillRect(x-(w>>1),y-(w>>1),w,w);if(x===x1&&y===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}}
}

    return [Math.round((hx+ax)/2)+(l>0.2?1:0),Math.round((hip+ay)/2)-(l>0.2?1:0),ax,ay];};
  const arm=(sx,t)=>{const a=Math.sin(t),l=Math.max(0,Math.cos(t));const hx=Math.round(sx+3*a),hy=19+by-Math.round(l);
    return [Math.round((sx+hx)/2)+(l>0?1:0),Math.round((13+by+hy)/2)+1,hx,hy];};
  return pose(by,by,0,leg(10,th),leg(12,th+Math.PI),arm(10,th+Math.PI),arm(12,th));
}

function drawLeg(g,o,hip,Lg,back,front){
  const w=o.wide?3:2;

  thick(g,Lg[0],Lg[1],Lg[2],Lg[3],w,back?o.pl:o.pa);
  if(!back&&!o.wide)thick(g,hip[0]-1,hip[1],Lg[0]-1,Lg[1],1,o.ph);

function drawArm(g,o,sh,A,back){
  const col=back?o.cl2:o.cl;

  g.fillStyle=o.skin;g.fillRect(A[2]-1,A[3]-1,2,2);

}
function drawTorso(g,o,P,style){
  const y0=12+P.by,h=o.long?10:7,x0=P.front?7:8,w=P.front?8:6,cx=x0+(w>>1);
  g.fillStyle=o.cl;g.fillRect(x0,y0,w,h);
  g.fillStyle=o.hi;g.fillRect(x0,y0,w,1);g.fillRect(x0,y0,1,h);
  g.fillStyle=o.lo;g.fillRect(x0,y0+h-1,w,1);g.fillRect(x0+w-1,y0,1,h);
  if(style==='nao'){
    g.fillStyle=o.skin;g.fillRect(cx-1,y0,2,1);
    g.fillStyle=o.hi;g.fillRect(x0+1,y0+2,1,h-4);g.fillRect(x0+w-2,y0+3,1,h-5);   // plis du pull
    g.fillStyle=o.lo;g.fillRect(x0+1,y0+h-2,w-2,1);
  }else if(style==='usf'){
    g.fillStyle=o.skin;g.fillRect(cx-1,y0,2,1);
    g.fillStyle=o.hi;g.fillRect(cx,y0+1,1,h-3);
    g.fillStyle='#3c3c4c';g.fillRect(x0+1,y0+2,1,1);g.fillRect(x0+w-2,y0+4,1,1);
    // jupe asymétrique
    g.fillStyle=o.pa;g.fillRect(x0-1,y0+h-1,w+2,3);
    g.fillStyle=o.hi;g.fillRect(x0-1,y0+h-1,w+2,1);
    g.fillStyle=o.lo;g.fillRect(x0-1,y0+h+1,w+2,1);
  }else if(style==='monz'){
    g.fillStyle='#74748c';g.fillRect(cx,y0+1,1,h-2);
    g.fillStyle=o.skin;g.fillRect(cx-1,y0,2,1);
    g.fillStyle='#d8d8e4';g.fillRect(cx-1,y0+2,2,2);                              // pendentif (khamsa)
    g.fillStyle=o.hi;g.fillRect(x0+1,y0+h-3,1,1);g.fillRect(x0+w-2,y0+h-3,1,1);
  }
}
function drawBody(g,o,P,style){
  const by=P.by,shY=13+by,hipY=19+by;
  const bs=P.front?8:10,fs=P.front?14:12,bh=P.front?9:10,fh=P.front?13:12;

let L=null,P=null;

function makeLevel(spec){
  const grid=buildGrid(spec),painted=grid.map(r=>r.map(()=>0));
  let total=0;grid.forEach(r=>r.forEach(t=>{if(t==='-')total++;}));
  const [tiles,tc]=mk(W,H);
  const lv={spec,grid,painted,total,n:0,th:THEMES[spec.theme],tiles,tc,bg:makeBG(spec),anim:0,tick:0,timeLeft:spec.time,
    enemies:spec.foes.map(([c,r,k,d])=>({ox:c*8+4,x:c*8+4,fy:r*8,dir:d,odir:d,speed:k==='F'?0.9:0.55,dead:0})),
    picks:spec.picks.map(([c,r])=>({c,r,got:0})),

    start:{x:spec.start[0]*8+4,y:spec.start[1]*8}};
  L=lv;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)drawTile(r,c);

}
function drawTile(r,c){
  const t=L.grid[r][c],x=c*8,y=r*8,g=L.tc;g.clearRect(x,y,8,8);
  if(t==='-'){
    const pal=L.painted[r][c]?L.th.pnt:L.th.unp;
    g.fillStyle=pal[0];g.fillRect(x,y,8,8);g.fillStyle=pal[1];g.fillRect(x,y,8,2);
    g.fillStyle=pal[2];g.fillRect(x,y+6,8,2);g.fillRect(x,y,1,8);
    if(L.painted[r][c]){g.fillStyle=pal[1];g.fillRect(x+2,y+3,4,2);}else{g.fillStyle=pal[2];g.fillRect(x+3,y+3,2,2);}
  }else if(t==='='){
    g.fillStyle='#2a1a22';g.fillRect(x,y,8,8);g.fillStyle='#4a3040';g.fillRect(x,y+3,8,1);g.fillRect(x,y+7,8,1);g.fillRect(x+((r&1)?2:6),y,1,3);g.fillRect(x+((r&1)?6:2),y+4,1,3);
  }else if(t==='H'){
    g.fillStyle='#d0d0d0';g.fillRect(x+1,y,1,8);g.fillRect(x+6,y,1,8);
    g.fillStyle='#8a8a9a';g.fillRect(x+2,y+1,4,1);g.fillRect(x+2,y+5,4,1);
  }
}
function tile(c,r){if(r<0||r>=ROWS||c<0||c>=COLS)return'.';return L.grid[r][c];}

  if(L.timeLeft<=0)L.timeLeft=40;G.popups=[];

function die(kind){
  if(P.dead)return;
  if(kind!=='fall'&&P.inv>0)return;
  P.dead=1;P.dt=0;P.dk=kind;G.lives--;
  if(kind==='fall'){P.vy=0;sfx('splat');}else{P.vy=-2.6;sfx('die');}
}

function paint(){
  const c=Math.floor(P.x/8),r=Math.round(P.y/8);
  if(L.grid[r]&&L.grid[r][c]==='-'&&!L.painted[r][c]){
    L.painted[r][c]=1;L.n++;drawTile(r,c);addScore(10);sfx('paint');

function floorUnder(x,y){return isFloor(Math.floor(x/8),Math.round(y/8));}
function ladderAt(x,row){for(const o of [0,-3,3]){const c=Math.floor((x+o)/8);if(tile(c,row)==='H')return c;}return -1;}
function tryLadder(dir){
  if(dir>0&&P.y%8!==0)return;
  const row=dir<0?Math.floor((P.y-1)/8):Math.round(P.y/8);
  const c=ladderAt(P.x,row);if(c<0)return;
  P.x=c*8+4;P.mode='ladder';P.vy=0;P.y=Math.round(P.y);P.lt=0;
}
function climb(dy){
  const c=Math.floor(P.x/8);
  if(dy<0){
    if(tile(c,Math.floor((P.y-1)/8))!=='H')return;
    P.y-=1;
    if(P.y%8===0){const r=P.y/8;if(tile(c,r)==='H'&&tile(c,r-1)!=='H')P.mode='ground';}
  }else{
    if(P.y%8===0){
      const t=tile(c,P.y/8);
      if(t==='-'){P.mode='ground';return;}
      if(t!=='H')return;
    }
    P.y+=1;
  }
}

function airTick(p,dx){
  let vx=p.vx0;
  if(vx!==0&&dx===-Math.sign(vx))vx*=0.35;      // on peut freiner, pas faire demi-tour
  p.x=clamp(p.x+vx,6,W-6);
  p.vy=Math.min(p.vy+GRAV,MAXV);
  const prev=p.y;p.y+=p.vy;p.jt++;
  if(p.vy>0){
    const c=Math.floor(p.x/8);
    for(let b=Math.ceil(prev/8)*8;b<=p.y;b+=8){if(isFloor(c,b/8)){p.y=b;return 'land';}}
  }
  if(p.y>H+12)return 'void';
  return null;
}

function updatePlay(){
  if(G.paused)return;
  const p=P;L.anim++;
  for(const q of G.popups)q.t++;
  G.popups=G.popups.filter(q=>q.t<50);
  if(p.dead){
    p.dt++;
    if(p.dk!=='fall'){p.y+=p.vy;p.vy+=0.18;}
    if(p.dt>(p.dk==='fall'?85:90)){if(G.lives<=0)gameOver();else respawn();}
    return;
  }
  if(p.inv>0)p.inv--;
  if(p.power>0)p.power--;
  if(++L.tick>=60){L.tick=0;L.timeLeft--;if(L.timeLeft<=0){L.timeLeft=0;die('time');return;}if(L.timeLeft<=10)sfx('tick');}
  if(edge.jump)p.jb=7;else if(p.jb>0)p.jb--;
  const dx=(keys.right?1:0)-(keys.left?1:0);
  p.moving=false;
  if(p.mode==='ladder'){
    const dy=(keys.down?1:0)-(keys.up?1:0);
    if(dy)climb(dy);
  }else{
    if(dx)p.face=dx;
    if(p.mode==='ground'){
      if(p.lt>0)p.lt--;
      if(dx){p.x=clamp(p.x+dx*SPD,6,W-6);p.anim+=SPD;p.moving=true;}
      /* on quitte le bord : chute verticale (vx0=0) */
      if(!floorUnder(p.x,p.y)){p.mode='air';p.vy=0;p.vx0=0;p.startY=p.y;p.jumped=false;p.jt=0;}
      else paint();
      if(G.state!=='play')return;
      if(p.mode==='ground'){
        if(p.jb>0){p.vy=-JV;p.vx0=dx*SPD;p.mode='air';p.startY=p.y;p.jumped=true;p.jt=0;p.jb=0;sfx('jump');}
        else if(keys.up)tryLadder(-1);
        else if(keys.down)tryLadder(1);
      }
    }
    if(p.mode==='air'){
      const r=airTick(p,dx);
      if(r==='land'){
        const drop=p.y-p.startY;
        p.mode='ground';p.vy=0;p.lt=p.jumped?7:4;
        if(drop>FALLMAX){die('fall');return;}
        sfx('land');paint();
        if(G.state!=='play')return;
      }else if(r==='void'){die('fall');p.y=H+12;return;}
    }
  }
  for(const k of L.picks){
    if(k.got)continue;
    const ix=k.c*8+4;
    if(Math.abs(p.x-ix)<9&&p.y-24<k.r*8&&p.y>(k.r-1)*8){k.got=1;p.power=420;addScore(50);sfx('pick');popup(ix,(k.r-1)*8-12,'+50');}
  }
  if(L.instr&&!L.instr.got){
    const k=L.instr,ix=k.c*8+4;
    if(Math.abs(p.x-ix)<9&&p.y-24<k.r*8&&p.y>(k.r-1)*8){
      k.got=1;G.got[k.type]=1;const own=INSTR[k.type].owner===G.avatar,pts=own?1000:500;
      addScore(pts);sfx('pick');popup(ix,(k.r-1)*8-22,'+'+pts);checkClear();
      if(G.state!=='play')return;
    }
  }
  for(const e of L.enemies){
    if(e.dead)continue;
    e.x+=e.dir*e.speed;
    const lead=e.x+e.dir*8;
    if(lead<4||lead>W-4||!isFloor(Math.floor(lead/8),e.fy/8)){e.dir=-e.dir;e.x+=e.dir*e.speed*2;}
    if(Math.abs(p.x-e.x)<10&&p.y>e.fy-14&&p.y-24<e.fy){
      if(p.power>0){e.dead=1;addScore(200);sfx('eat');popup(e.x,e.fy-26,'+200');}
      else die('hit');
    }
  }
}

/* ---------- affichage ---------- */
const RASTER=['#ff4040','#ff8030','#ffd030','#a0ff40','#40e0ff','#8060ff','#ff60d0'];
function c64Screen(){ctx.fillStyle='#6c5eb5';ctx.fillRect(0,0,W,H);ctx.fillStyle='#352879';ctx.fillRect(16,16,W-32,H-32);}
function blink(n){return Math.floor(G.t/(n||30))%2===0;}
const WALK=['w1','w2','w4','w5'];
const touchMode=()=>document.body.classList.contains('touch');
function renderTitle(){
  c64Screen();
  text('LAZYMAN','c',34,(r)=>(r<4?'#ffd030':'#ff7a28'),6,{shadow:true});
  text('A LAZYWALL GAME','c',92,'#fff',1);
  text('WALK ON EVERY TILE','c',108,'#b8c76f',1);
  const fy=208;
  for(let i=0;i<3;i++){
    const nm=['w0','w1','w2','w3','w4','w5'][(Math.floor(G.t/3)+i*2)%6];
    drawSpr(i,nm,110+i*90,fy,1,2);
  }
  ctx.fillStyle='#6f3d86';ctx.fillRect(16,fy,W-32,3);
  ctx.fillStyle='#9a6759';ctx.fillRect(16,fy+3,W-32,H-32-(fy+3-16)+0);
  ctx.fillStyle='#352879';ctx.fillRect(16,H-16,W-32,0);
  for(let x=16;x<W-16;x+=16){ctx.fillStyle='#68372b';ctx.fillRect(x,fy+10,15,1);ctx.fillRect(x+((x/16)&1?8:0),fy+3,1,7);}
  if(blink(30))text(touchMode()?'TAP TO PLAY':'PRESS SPACE','c',fy+16,'#fff',1,{shadow:true});
  text('HI-SCORE '+String(G.hi).padStart(6,'0'),'c',fy+30,'#70a4b2',1);
}
function renderSelect(){
  c64Screen();
  text('CHOOSE YOUR BANDMATE','c',26,'#ffd030',2,{shadow:true});
  for(let i=0;i<3;i++){
    const cx=76+i*124,sel=G.sel===i;
    ctx.fillStyle=sel?'#4a3a9a':'#2a2060';ctx.fillRect(cx-56,52,112,152);
    ctx.fillStyle=sel?(blink(10)?'#fff':'#ffd030'):'#6c5eb5';
    ctx.fillRect(cx-56,52,112,2);ctx.fillRect(cx-56,202,112,2);ctx.fillRect(cx-56,52,2,152);ctx.fillRect(cx+54,52,2,152);
    const nm=sel?['w0','w1','w2','w3','w4','w5'][Math.floor(G.t/3)%6]:'idle0';
    drawSpr(i,nm,cx,166,1,3);
    const n=AVATARS[i].name;
    text(n,cx-Math.round((n.length*12-2)/2),172,sel?'#fff':'#9a9ad0',2);
    const rl=AVATARS[i].role;text(rl,cx-Math.round((rl.length*6-1)/2),192,sel?'#ffd030':'#6c5eb5',1);
  }
  text('< > CHOOSE      SPACE : PLAY','c',222,'#9ad284',1);
}
function renderIntro(){
  const spec=LEVELS[G.lvl],th=THEMES[spec.theme];
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=th.pnt[0];ctx.fillRect(0,0,W,4);ctx.fillRect(0,H-4,W,4);
  text('EPISODE '+(G.lvl+1)+' / '+LEVELS.length,'c',22,'#8a8a8a',1);
  text(spec.name,'c',40,'#ffe040',2,{shadow:true});
  text('- '+spec.sub+' -','c',64,'#70d8f0',1);
  spec.story.forEach((ln,i)=>text(ln,'c',92+i*12,'#e0e0e0',1));
  const x=(G.t*1.6)%460-30;
  drawSpr(G.avatar,['w0','w1','w2','w3','w4','w5'][Math.floor(G.t/3)%6],x,226,1,1);
  ctx.fillStyle=th.unp[1];ctx.fillRect(0,226,W,2);
  if(G.t>20&&blink(30))text(touchMode()?'TAP TO START':'PRESS SPACE TO START','c',242,'#fff',1);
}
function drawHUD(){
  ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,W,12);ctx.fillStyle='#6c5eb5';ctx.fillRect(0,12,W,1);
  text('SCORE '+String(G.score).padStart(6,'0'),4,3,'#fff',1);
  text('HI '+String(Math.max(G.hi,G.score)).padStart(6,'0'),98,3,'#70a4b2',1);
  const low=L.timeLeft<=10;
  text('TIME '+String(L.timeLeft).padStart(3,'0'),186,3,low&&blink(10)?'#ff4040':'#ffd030',1);
  if(P.power>0){ctx.fillStyle='#2a2a5a';ctx.fillRect(290,3,36,6);ctx.fillStyle='#ffe040';ctx.fillRect(291,4,Math.round(34*P.power/420),4);}
  else if(muted)text('SOUND OFF',290,3,'#6c6c8c',1);
  for(let i=0;i<3;i++){ctx.globalAlpha=G.got[i]?1:0.22;ctx.drawImage(INSTC[i],0,0,12,16,250+i*13,2,6,8);}
  ctx.globalAlpha=1;
  if(G.t<200&&L.n<L.total)text(L.spec.name,'c',20,'#ffe040',1,{shadow:true});
  if(L.n>=L.total&&L.instr&&!L.instr.got&&blink(20))text('GRAB '+INSTR[L.instr.type].txt+'!','c',20,'#ffe040',1,{shadow:true});
  for(let i=0;i<Math.min(G.lives,5);i++)ctx.drawImage(HEADC[G.avatar],W-14-i*14,0);
  ctx.fillStyle='#2a2a5a';ctx.fillRect(0,13,W,2);ctx.fillStyle='#b8c76f';ctx.fillRect(0,13,Math.round(W*L.n/L.total),2);
}
function playerPose(p){
  if(p.dead)return 'fall';
  if(p.mode==='ladder')return ['c0','c1','c2','c3'][Math.floor(p.y/4)&3];
  if(p.mode==='air'){
    if(p.jumped&&p.jt<4)return 'launch';
    if(p.vy<-1.4)return 'rise';
    if(p.vy<1.4)return 'apex';
    return 'fall';
  }
  if(p.lt>0)return 'crouch';
  if(p.moving)return 'w'+(Math.floor(p.anim/4.5)%6);
  return (Math.floor(G.t/30)&1)?'idle1':'idle0';
}
function renderPlay(){
  ctx.drawImage(L.bg,0,0);ctx.drawImage(L.tiles,0,0);
  const fr=(L.anim>>4)&1;
  for(const k of L.picks)if(!k.got)drawPick(k.c*8-2,(k.r-1)*8-6+((L.anim>>5)&1)*2,fr);
  if(L.instr&&!L.instr.got){const k=L.instr,bob=(L.anim>>4)&1;drawInstr(k.type,k.c*8+4-6,k.r*8-17-bob,1);if((L.anim>>3)&1){ctx.fillStyle='#fff';const sx=k.c*8+4+7,sy=k.r*8-19;ctx.fillRect(sx-1,sy,3,1);ctx.fillRect(sx,sy-1,1,3);}}
  for(const e of L.enemies){
    if(e.dead>0)continue;
    let tint=null;
    if(P.power>0){tint=(P.power>120||(P.power>>3)&1)?((P.power>>2)&1?'#4a6aff':'#fff'):null;}
    drawFoe(L.spec.foe,e.x,e.fy,(Math.floor(e.x/4))&1,e.dir,tint);
  }
  if(P.dead&&P.dk==='fall'&&P.y<=H){
    drawLying(G.avatar,P.x,P.y,P.face,P.dt);
  }else if(!(P.inv>0&&!P.dead&&((L.anim>>2)&1))){
    if(P.dead&&((P.dt>>2)&1))ctx.globalAlpha=0.5;
    drawSpr(G.avatar,playerPose(P),P.x,P.y,P.face,1);
    ctx.globalAlpha=1;
  }
  for(const q of G.popups)text(q.txt,Math.round(q.x-q.txt.length*3),Math.round(q.y-q.t*0.4),'#fff',1,{shadow:true});
  drawHUD();
}
function panel(lines,col){
  ctx.fillStyle='#000';ctx.fillRect(80,100,240,70);ctx.fillStyle=col||'#6c5eb5';
  ctx.fillRect(80,100,240,2);ctx.fillRect(80,168,240,2);ctx.fillRect(80,100,2,70);ctx.fillRect(318,100,2,70);
  lines.forEach((l,i)=>text(l[0],'c',112+i*18,l[1],l[2]||1,{shadow:l[2]>1}));
}
function renderOver(){
  c64Screen();
  text('GAME OVER','c',54,'#ff4040',5,{shadow:true});
  text('SCORE '+String(G.score).padStart(6,'0'),'c',116,'#fff',2);
  text('HI-SCORE '+String(G.hi).padStart(6,'0'),'c',144,'#70a4b2',1);
  drawLying(G.avatar,200,206,1,G.t);
  if(G.t>40&&blink(30))text('PRESS SPACE TO PLAY AGAIN','c',216,'#ffd030',1);
}
function renderWin(){
  c64Screen();
  text('BRAVO !','c',30,(r)=>(r<4?'#ffd030':'#ff7a28'),5,{shadow:true});
  text('YOU GOT ALL THE GEAR BACK!','c',84,'#fff',1);
  text('LAZYWALL - SINCE 2003','c',98,'#ffd030',1);
  text('SCORE '+String(G.score).padStart(6,'0'),'c',120,'#fff',2);
  text('HI-SCORE '+String(G.hi).padStart(6,'0'),'c',142,'#70a4b2',1);
  for(let i=0;i<3;i++)drawSpr(i,['w0','w1','w2','w3','w4','w5'][(Math.floor(G.t/3)+i*2)%6],130+i*70,206,1,2);
  for(let i=0;i<3;i++){const ty=INSTR.findIndex(q=>q.owner===i);drawInstr(ty,130+i*70+22,166+((G.t>>4)&1),1);}
  if(G.t>60&&blink(30))text('PRESS SPACE TO PLAY AGAIN','c',222,'#9ad284',1);
}
function render(){
  switch(G.state){
    case 'title':renderTitle();break;
    case 'select':renderSelect();break;
    case 'intro':renderIntro();break;
    case 'play':renderPlay();if(G.paused)panel([['PAUSE','#ffd030',2],['P : RESUME','#fff']]);break;
    case 'clear':renderPlay();panel([['LEVEL CLEAR!','#ffd030',2],['TIME BONUS +'+G.bonus,'#fff']],'#b8c76f');break;
    case 'over':renderOver();break;
    case 'win':renderWin();break;
  }
}

/* ---------- boucle ---------- */
function update(){
  G.t++;
  switch(G.state){
    case 'title':if(edge.jump){audioInit();sfx('menu');G.state='select';G.t=0;}break;
    case 'select':
      if(edge.left){G.sel=(G.sel+2)%3;sfx('menu');}
      if(edge.right){G.sel=(G.sel+1)%3;sfx('menu');}
      if(edge.jump){G.avatar=G.sel;startGame();}
      break;
    case 'intro':if(G.t>20&&edge.jump)startLevel();break;
    case 'play':updatePlay();break;
    case 'clear':
      if(G.t>=170){G.lvl++;if(G.lvl>=LEVELS.length){saveHi();G.state='win';G.t=0;}else enterIntro();}
      break;
    case 'over':case 'win':if(G.t>40&&edge.jump){G.state='title';G.t=0;}break;
  }
  for(const k in edge)edge[k]=0;
}
let last=0,acc=0;const STEP=1000/60;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  acc+=Math.min(100,ts-last);last=ts;
  let n=0;while(acc>=STEP&&n<4){update();acc-=STEP;n++;}
  if(n===4)acc=0;
  render();
}

/* ---------- entrées ---------- */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',Enter:'jump',KeyK:'jump'};
window.addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];
  if(k){if(!keys[k])edge[k]=1;keys[k]=1;e.preventDefault();audioInit();return;}
  const key=(e.key||'').toLowerCase();
  if(key==='p'&&G.state==='play'){G.paused=!G.paused;e.preventDefault();}
  else if(key==='m'){muted=!muted;e.preventDefault();}
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){keys[k]=0;e.preventDefault();}});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=0;if(G.state==='play')G.paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.state==='play')G.paused=true;if(actx)actx.suspend();}else if(actx&&actx.state==='suspended'&&!muted)actx.resume();});
cv.addEventListener('pointerdown',e=>{
  cv.focus();audioInit();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;
  if(G.state==='title'){edge.jump=1;}
  else if(G.state==='select'){G.sel=x<W/3?0:(x<2*W/3?1:2);edge.jump=1;}
  else if(G.state==='intro'||G.state==='over'||G.state==='win'){edge.jump=1;}
  else if(G.state==='play'&&G.paused){G.paused=false;}
});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();audioInit();if(!keys[k])edge[k]=1;keys[k]=1;b.classList.add('on');};
  const up=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',down);
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
if(('ontouchstart' in window)||navigator.maxTouchPoints>0)document.body.classList.add('touch');

/* ---------- mise à l'échelle ---------- */
function fit(){
  const touch=document.body.classList.contains('touch');
  const extra=touch?150:62;
  const maxW=window.innerWidth-16,maxH=window.innerHeight-extra-16;
  let w=Math.min(maxW,maxH*(W/H));
  const k=Math.floor(w/W);if(k>=2)w=W*k;
  w=Math.max(200,Math.floor(w));
  cv.style.width=w+'px';cv.style.height=Math.round(w*H/W)+'px';
}
window.addEventListener('resize',fit);fit();

if(window.__LW_TEST)window.__LW_TEST({G,keys,edge,update,startLevel,getL:()=>L,getP:()=>P,LEVELS,buildGrid,isFloor,tile,airTick,die,
  K:{SPD,GRAV,JV,MAXV,FALLMAX,W,H,COLS,ROWS},HEADC,SPR,POSE_NAMES,AVATARS,render,ctx,drawSpr});
requestAnimationFrame(frame);
})();
