<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>LAZYMAN</title>
<style>html,body{margin:0;height:100%;background:#07040e;overflow:hidden;font-family:"Courier New",monospace;color:#fff}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#3a1458,#07040e);transition:opacity .45s;z-index:2}
h1{margin:0 0 26px;font-size:clamp(34px,11vw,56px);letter-spacing:5px;color:#ffe040;text-shadow:0 5px 0 #c02870,0 0 24px #ff3a9a}
.bar{width:min(70vw,360px);height:14px;border:3px solid #fff;border-radius:9px;overflow:hidden;background:#0007}
#f{height:100%;width:2%;background:linear-gradient(90deg,#ff3a9a,#ffe040);transition:width .2s}
#t{margin-top:14px;font-size:13px;letter-spacing:2px;color:#ffc8e8}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07040e}</style></head><body>
<div id="ld"><h1>LAZYMAN</h1><div class="bar"><div id="f"></div></div><div id="t">DOWNLOADING…</div></div>
<iframe id="g" title="LAZYMAN" allow="fullscreen; autoplay"></iframe>
<script>
const TOTAL=3464899,f=document.getElementById('f'),t=document.getElementById('t'),ld=document.getElementById('ld'),g=document.getElementById('g');
let last=0;const set=(p,x)=>{p=Math.max(last,Math.min(1,p));last=p;f.style.width=(p*100)+'%';if(x)t.textContent=x;};
addEventListener('message',e=>{const d=e.data;if(!d||!d.lm)return;
 if(d.lm==='progress')set(0.7+0.3*d.p,d.txt||'LOADING…');
 if(d.lm==='ready'){set(1,'READY');setTimeout(()=>{ld.style.opacity=0;setTimeout(()=>{ld.style.display='none';try{g.contentWindow.focus()}catch(_){}},450)},200);}});
(async()=>{try{
 const r=await fetch('game.html'),len=+r.headers.get('content-length')||0,tot=TOTAL||len,rd=r.body.getReader(),parts=[];let n=0;
 for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);n+=value.length;set(0.7*Math.min(0.99,n/tot),'DOWNLOADING… '+Math.round(Math.min(0.99,n/tot)*100)+'%');}
 set(0.7,'STARTING…');g.src=URL.createObjectURL(new Blob(parts,{type:'text/html'}));
}catch(e){t.textContent='LOAD ERROR — please reload';g.src='game.html';}})();
</script></body></html>
